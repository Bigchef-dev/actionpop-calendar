name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Documentation-only changes skip the expensive jobs; `gate` still reports so a
    # required status check never blocks the pull request.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - '.github/skills/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A required status check must always report, even when the path filters below skip
  # every other job. Without this gate a documentation-only pull request stays blocked.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "CI gate satisfied"

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:dead
      - run: pnpm check:cycles
      - run: pnpm check:spell
      - run: pnpm check:licenses
      - run: pnpm audit:high

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The browser suite is the only automated check of the published experience: journey reporting
  # must never break the calendar, and the SPA must render behind the edge without a CSP violation.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
