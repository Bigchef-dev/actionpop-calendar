name: Security

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - '.zap/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails only on high and critical vulnerabilities in production dependencies:
      # low-severity advisories and dev-only packages never block a merge.
      - run: pnpm audit --prod --audit-level=high

  # Attacks the surface a visitor actually reaches: the edge allowlist and its headers. A high
  # severity finding blocks the release; every other finding is triaged in
  # docs/security/findings.md. The report is uploaded on success as well as failure, because an
  # accepted finding must stay reviewable.
  exploitation:
    name: exploitation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Optional gate: the scan needs the whole stack (four images, Postgres, Redis, the edge) and
    # its infrastructure can fail for reasons unrelated to the change under review. A failure is
    # reported and the report is uploaded, but it never blocks the pull request; a high-severity
    # finding is still visible in the job summary and in the uploaded report.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # The stack joins the network a Prometheus project owns in production. Compose never
      # creates an external network, so the runner provides it like a deployment host does.
      - name: Create the monitoring network
        run: docker network create "${MONITORING_NETWORK:-monitoring}"
      - name: Start the published stack
        env:
          # The worker refuses to start without an upstream base URL and the scan never exercises
          # it, so it gets a reserved address that never answers instead of a real one.
          UPSTREAM_BASE_URL: http://upstream.invalid
        run: |
          docker compose -f infra/compose/docker-compose.yml \
                         -f infra/compose/docker-compose.security.yml up -d --build
      - name: Wait for the edge
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/compose/docker-compose.yml \
                         -f infra/compose/docker-compose.security.yml logs
          echo '::error::the edge never became reachable'
          exit 1
      - name: Run the baseline scan
        run: |
          mkdir -p zap-report
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8080 \
            -c /zap/wrk/.zap/rules.tsv \
            -J zap-report/zap-report.json \
            -r zap-report/zap-report.html \
            -w zap-report/zap-report.md
      - name: Fail on a high severity finding
        run: node scripts/zap-gate.mjs zap-report/zap-report.json
      - name: Smoke the published site through the edge
        env:
          EDGE_BASE_URL: http://127.0.0.1:8080
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test apps/web/tests/edge-smoke.spec.ts
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report/
          retention-days: 30
      - name: Stop the stack
        if: always()
        run: |
          docker compose -f infra/compose/docker-compose.yml \
                         -f infra/compose/docker-compose.security.yml down -v
