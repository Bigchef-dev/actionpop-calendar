name: Integration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'prisma/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: actionpop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Matches infra/compose/docker-compose.yml: CI must exercise the version that runs.
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/actionpop
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/actionpop
      REDIS_URL: redis://localhost:6379
      UPSTREAM_BASE_URL: https://actionpopulaire.fr
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `test:integration` generates the Prisma client and builds @actionpop/core itself,
      # so the same command sequence works on any runner (GitHub, GitLab, local).
      - run: pnpm test:integration
