# The only public surface of the application.
#
# Closed by default: a path is reachable because it is listed here, so adding a route is a visible
# decision. Everything else answers 404 without disclosing whether it exists. `/internal/*` is
# never routed: Prometheus and the health probes reach those ports over the private networks.

server {
  listen 80;
  server_name calendar.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name calendar.example;

  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;

  # Never disclose the exact nginx build to a scanner or an attacker.
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # The published site.
  location = / {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /assets/ {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Root-level files copied from apps/web/public/ (for example tortue-hourra.png).
  location ~* ^/[^/]+\.(png|ico|svg|webp|txt)$ {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # The calendar surfaces.
  location = /calendar.ics {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $host;
  }

  location ^~ /search/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $host;
  }

  location ^~ /events {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $host;
  }

  location ^~ /feed/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $host;
  }

  # Journey batches: the only write surface, same origin as the site.
  location = /telemetry/journey {
    # A refused method must answer 405, not the 403 nginx produces for `deny all`.
    limit_except POST { deny all; }
    error_page 403 = @journey_method_not_allowed;
    client_max_body_size 2k;
    proxy_pass http://api:3000;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $host;
  }

  # Everything else, including /internal/*, /reference and /openapi.json.
  # The only write surface answers 405 to anything but POST, as documented in the contract.
  location @journey_method_not_allowed {
    add_header Allow "POST" always;
    return 405;
  }

  location / {
    return 404;
  }
}
