# The application edge, one hop behind the host-wide TLS terminator (Caddy).
#
# Closed by default: a path is reachable because it is listed here, so adding a route is a visible
# decision. Everything else answers 404 without disclosing whether it exists. `/internal/*` is
# never routed: Prometheus and the health probes reach those ports over the private networks.

server {
  listen 80;
  server_name calendar.example;

  # Never disclose the exact nginx build to a scanner or an attacker.
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  # Caddy terminates TLS, so from the browser's point of view every request that reaches this
  # block is HTTPS: HSTS is emitted here and Caddy passes it through untouched. The 80 → 301
  # redirect is Caddy's job too, which is why nothing listens on 443 here.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Preserve the client chain Caddy established. `$proxy_add_x_forwarded_for` keeps the browser
  # address first, which is the entry the API hashes for its request-volume band.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  # The published site.
  location = / {
    proxy_pass http://web:8080;
  }

  location /assets/ {
    proxy_pass http://web:8080;
  }

  # Root-level files copied from apps/web/public/ (for example tortue-hourra.png).
  location ~* ^/[^/]+\.(png|ico|svg|webp|txt)$ {
    proxy_pass http://web:8080;
  }

  # The calendar surfaces.
  location = /calendar.ics {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
  }

  location ^~ /search/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
  }

  location ^~ /events {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
  }

  location ^~ /feed/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
  }

  # Journey batches: the only write surface, same origin as the site.
  location = /telemetry/journey {
    # A refused method must answer 405, not the 403 nginx produces for `deny all`.
    limit_except POST { deny all; }
    error_page 403 = @journey_method_not_allowed;
    client_max_body_size 2k;
    proxy_pass http://api:3000;
  }

  # Everything else, including /internal/*, /reference and /openapi.json.
  # The only write surface answers 405 to anything but POST, as documented in the contract.
  location @journey_method_not_allowed {
    add_header Allow "POST" always;
    return 405;
  }

  location / {
    return 404;
  }
}
