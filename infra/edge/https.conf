# The production vhost of the published edge, one hop behind the host-wide TLS terminator (Caddy).
#
# This file is deliberately thin: routing lives in `snippets/routes.conf`, the header policy in
# `snippets/security-headers.conf`, the proxy defaults in `snippets/proxy.conf`. What remains here
# is only what differs between vhosts, which is what keeps `http-scan.conf` honest — the CI scan
# attacks this same routing table and this same header set.
#
# Validate a change with:
#   docker run --rm -v "$PWD/infra/edge:/etc/nginx/app:ro" \
#     -v "$PWD/infra/edge/https.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:1.29-alpine nginx -t

# Must stay outside `server`: an `upstream` block is only valid at `http` level. This file is a
# `conf.d` include, which *is* the `http` context.
include /etc/nginx/app/snippets/upstreams.conf;

server {
  # One listener: the host-wide Caddy owns 80/443 and reaches this vhost as `edge:8080`.
  # A second listener on 80 used to accommodate a deployment whose Caddy targeted `edge:80`;
  # it is gone so the port in the Caddyfile is the only port this vhost can answer on.
  listen 8080;
  server_name _;

  # Never disclose the exact nginx build to a scanner or an attacker.
  server_tokens off;

  # The error pages and the API bodies are UTF-8; without this, browsers guess.
  charset utf-8;

  include /etc/nginx/app/snippets/security-headers.conf;
  include /etc/nginx/app/snippets/proxy.conf;

  # Caddy terminated TLS, so the request the browser made was HTTPS even though this hop is plain
  # HTTP. The API keys its request-volume band on the forwarded chain, so both headers matter.
  proxy_set_header X-Forwarded-Proto https;

  include /etc/nginx/app/snippets/routes.conf;
}
