# THE routing table of the published edge, included by `https.conf` and `http-scan.conf`.
#
# Closed by default: a path is reachable because it is listed here, so adding a route is a visible
# decision rather than a side effect. Everything else answers the branded 404 below instead of
# nginx's bare page. `/internal/*`, `/reference` and `/openapi.json` are deliberately absent:
# Prometheus and the health probes reach those ports over the private networks.
#
# Both vhosts include this exact file, so production and the CI scan cannot drift apart. Adding a
# route means editing this file only; see infra/edge/README.md.
#
# Matching order matters: exact (`=`) wins, then the longest `^~` prefix (which stops the regex
# below from being evaluated), then the regex, then the longest plain prefix.

# --- Error pages ------------------------------------------------------------------------------
# Served by this vhost from the mounted configuration directory, so a page is still rendered when
# the upstream it would describe is down. `internal` keeps them non-addressable.
error_page 404 /errors/404.html;
error_page 500 502 503 504 /errors/50x.html;

location ^~ /errors/ {
    internal;
    root /etc/nginx/app;
}

# --- Liveness ------------------------------------------------------------------------------------
# Loopback only inside the container: a deployment needs to know this vhost is serving, and no
# other container may reach it (the edge port is exposed, never published). No upstream is
# involved, so a restart loop can never come from the API or the site being down.

location = /healthz {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;
    default_type text/plain;
    return 200 'ok';
}

# --- The published site ------------------------------------------------------------------------

location = / {
    proxy_pass http://web:8080;
}

location /assets/ {
    proxy_pass http://web:8080;
}

# Root-level files copied from apps/web/public/ (for example tortue-hourra.png).
location ~* ^/[^/]+\.(png|ico|svg|webp|txt)$ {
    proxy_pass http://web:8080;
}

# --- API reads ---------------------------------------------------------------------------------
# Every read is GET/HEAD only. A refused method answers 405 with an `Allow` header, not the 403
# `deny all` produces on its own.

location = /calendar.ics {
    limit_except GET HEAD { deny all; }
    error_page 403 = @read_method_not_allowed;
    proxy_pass http://api:3000;
}

location ^~ /search/ {
    limit_except GET HEAD { deny all; }
    error_page 403 = @read_method_not_allowed;
    proxy_pass http://api:3000;
}

location = /events {
    limit_except GET HEAD { deny all; }
    error_page 403 = @read_method_not_allowed;
    proxy_pass http://api:3000;
}

location ^~ /events/ {
    limit_except GET HEAD { deny all; }
    error_page 403 = @read_method_not_allowed;
    proxy_pass http://api:3000;
}

location = /groups {
    limit_except GET HEAD { deny all; }
    error_page 403 = @read_method_not_allowed;
    proxy_pass http://api:3000;
}

location ^~ /groups/ {
    limit_except GET HEAD { deny all; }
    error_page 403 = @read_method_not_allowed;
    proxy_pass http://api:3000;
}

location ^~ /feed/ {
    limit_except GET HEAD { deny all; }
    error_page 403 = @read_method_not_allowed;
    proxy_pass http://api:3000;
}

# --- The only write surface ---------------------------------------------------------------------

location = /telemetry/journey {
    limit_except POST { deny all; }
    error_page 403 = @write_method_not_allowed;
    client_max_body_size 2k;
    proxy_pass http://api:3000;
}

# --- Method rejections --------------------------------------------------------------------------
# `add_header` resets inheritance, so each named location re-includes the header policy; without
# it these responses would be the only ones served without a CSP.

location @read_method_not_allowed {
    include /etc/nginx/app/snippets/security-headers.conf;
    add_header Allow "GET, HEAD" always;
    default_type application/json;
    return 405 '{"error":"method_not_allowed","allow":"GET, HEAD"}';
}

location @write_method_not_allowed {
    include /etc/nginx/app/snippets/security-headers.conf;
    add_header Allow "POST" always;
    default_type application/json;
    return 405 '{"error":"method_not_allowed","allow":"POST"}';
}

# --- Fallback -----------------------------------------------------------------------------------

location / {
    return 404;
}
