# The two application upstreams, included at `http` level by both vhosts.
#
# They exist for one reason: name resolution. A literal `proxy_pass http://web:8080` is resolved
# once when nginx starts and the address is kept for the lifetime of the worker, so redeploying
# `web` or `api` (new container, new address) left the edge proxying to a dead address: every
# request answered 502, and the log said `connect() failed (111: Connection refused)` on the old
# address until someone restarted the edge as well. `depends_on: service_healthy` only orders the
# first start; it cannot re-resolve anything afterwards.
#
# `resolve` re-resolves the group members after `valid`, so an upstream that comes back with a
# new address is picked up within ten seconds and no edge restart is needed. A name that does not
# resolve yet is logged and the group is marked unavailable — nginx still starts, which is what
# keeps `nginx -t` usable inside the image build, where no Docker DNS exists.
#
# `127.0.0.11` is the Docker embedded DNS server; `ipv6=off` because the private network is IPv4.
# `zone` is required by `resolve`: the addresses are shared between workers.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_upstream {
    zone web_upstream 64k;
    server web:8080 resolve;
}

upstream api_upstream {
    zone api_upstream 64k;
    server api:3000 resolve;
}
