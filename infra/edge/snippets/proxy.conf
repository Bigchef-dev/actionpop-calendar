# Proxy defaults shared by both vhosts.
#
# Declared at server level and inherited by every `location`, so a route is one `proxy_pass` line
# and cannot forget the client identity the API depends on. `X-Forwarded-Proto` is deliberately
# NOT set here: production must claim `https` because Caddy terminated TLS, while the plain-HTTP
# scan twin must describe what it really is. Each vhost sets it once.
#
# The upstream groups live in `snippets/upstreams.conf`, included at `http` level (an `upstream`
# cannot be declared inside a `server`). They are there for name resolution, not for pooling: no
# `keepalive` directive, because the API already answers in single-digit milliseconds on the
# private network and connection reuse would buy nothing for the extra configuration it needs.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# Bounded, so an unresponsive upstream fails the request instead of holding a worker forever.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Upstream-produced error bodies are the API's JSON contract; only an edge-level 404 (a path this
# vhost does not route) is replaced by the branded page below.
proxy_intercept_errors off;
