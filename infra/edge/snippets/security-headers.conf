# The single response-header policy for everything the edge serves.
#
# Included at server level by `https.conf` and `http-scan.conf`, and re-included by the two named
# locations that must call `add_header` themselves: nginx discards every inherited `add_header`
# as soon as a block declares one, so a named location without this include would answer without
# a CSP. One file, one place to audit, no drift between production and the scan twin.
#
# These are asserted against the contract by tests/integration/edge-surface.test.ts.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# TLS terminates at the host-wide Caddy, so from the browser's point of view every request that
# reaches this vhost is HTTPS. The header is emitted here and Caddy passes it through untouched.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
