# Plain-HTTP twin of `https.conf`, used only by the CI exploitation scan.
#
# It exists so the scan attacks the published surface rather than an API container: the same
# routing table and the same header snippet, without certificates to generate on a runner. Only
# the listener and the forwarded transport differ, which is the honest difference between the two
# vhosts; everything a route or a header could drift on is included from the same files.
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.security.yml up -d --build

server {
  listen 8080;
  server_name _;

  # Never disclose the exact nginx build to a scanner or an attacker.
  server_tokens off;

  charset utf-8;

  include /etc/nginx/app/snippets/security-headers.conf;
  include /etc/nginx/app/snippets/proxy.conf;

  # This vhost really is plain HTTP, so it says so instead of claiming the production value.
  proxy_set_header X-Forwarded-Proto $scheme;

  include /etc/nginx/app/snippets/routes.conf;
}
