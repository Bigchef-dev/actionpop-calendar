# Plain-HTTP twin of `https.conf`, used only by the CI exploitation scan.
#
# It exists so the scan attacks the published surface rather than an API container: the same
# allowlist and the same header snippet, without certificates to generate on a runner. The two
# location tables are asserted identical by tests/integration/edge-surface.test.ts, so this file
# cannot drift into a softer configuration than production.
server {
  listen 8080;
  server_name _;

  # Never disclose the exact nginx build to a scanner or an attacker.
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  location = / {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
  }

  location /assets/ {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
  }

  location ~* ^/[^/]+\.(png|ico|svg|webp|txt)$ {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
  }

  location = /calendar.ics {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location ^~ /search/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location ^~ /events {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location ^~ /feed/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location = /telemetry/journey {
    # A refused method must answer 405, not the 403 nginx produces for `deny all`.
    limit_except POST { deny all; }
    error_page 403 = @journey_method_not_allowed;
    client_max_body_size 2k;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  # The only write surface answers 405 to anything but POST, as documented in the contract.
  location @journey_method_not_allowed {
    add_header Allow "POST" always;
    return 405;
  }

  location / {
    return 404;
  }
}
