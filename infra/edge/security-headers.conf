# Shared by the HTTPS server and the plain-HTTP scan server, so the CI scan validates exactly the
# headers production serves. Never add a header in only one of them: the scan would then pass on a
# configuration that is not deployed.
#
# Two allowances are deliberate and narrow:
#   `style-src 'unsafe-inline'` — Tailwind and Vue inject styles at runtime.
#   `font-src ... data:`         — FullCalendar embeds its icon font as a data: URI.
# Scripts are never allowed inline, so a markup injection cannot become script execution.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Every resource this site loads is same-origin or a data: image, so requiring a CORP header costs
# nothing and removes a class of cross-origin embedding attacks.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
