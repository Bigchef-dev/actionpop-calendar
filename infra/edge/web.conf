# Static delivery of the published site. Caching only: headers, transport and routing belong to
# the edge (infra/edge/https.conf), so there is exactly one place to audit.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The SPA owns query-string state, so every unknown path is not a route: it is simply absent.
  location = / {
    try_files /index.html =404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* ^/[^/]+\.(png|ico|svg|webp|txt)$ {
    try_files $uri =404;
    expires 1h;
  }

  location / {
    try_files $uri =404;
  }
}
