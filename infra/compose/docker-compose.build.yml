# Build definitions for this stack, combined with `docker-compose.yml` by anything that builds the
# images from a checkout: the CI exploitation scan and a local build.
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.build.yml up -d --build
#
# The production file declares images only, so `docker compose pull` succeeds without
# `--ignore-buildable`: a `build:` key makes Compose build the service too, and the pull fails when
# the image tag was never published. Keep this file to `build:` keys only — everything else belongs
# to the production file, where both paths read it.
services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_BASE_PATH: /

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker

  edge:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.edge
      # `Dockerfile.edge` ends with the `scan` stage, so an untargeted build produces the plain-HTTP
      # twin used by the CI scan. Naming the stage is what makes this the production vhost.
      target: edge
