name: actionpop

services:
  redis:
    # Pinned to the current major. Redis refuses to load a data directory written by a newer
    # version (an 8.x volume is RDB format 15, unreadable by 7.x), so this tag must only ever move
    # forward, or the named volume must be recreated.
    image: redis:8-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - private
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-actionpop}
      POSTGRES_USER: ${POSTGRES_USER:-actionpop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-actionpop}
    volumes:
      # PostgreSQL 18 keeps PGDATA in a versioned subdirectory, so the volume mounts the parent.
      # Mounting `/var/lib/postgresql/data` makes the 18 image refuse to start.
      - postgres-data:/var/lib/postgresql
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the migrations the running images expect, then exits. Both application
  # services wait for it, so a deployment can never start against an older schema.
  migrate:
    image: ${WORKER_IMAGE:-ghcr.io/bigchef-dev/actionpop-worker:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    entrypoint: ['node_modules/.bin/prisma', 'migrate', 'deploy', '--schema=prisma/schema.prisma']
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://actionpop:actionpop@postgres:5432/actionpop}
      NODE_ENV: ${NODE_ENV:-production}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: 'no'

  # The published site. It is served by the edge, which owns headers and routing, so a visitor
  # gets one origin and no cross-origin requests are needed.
  web:
    image: ${WEB_IMAGE:-ghcr.io/bigchef-dev/actionpop-web:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_BASE_PATH: /
    networks:
      - private
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  api:
    image: ${API_IMAGE:-ghcr.io/bigchef-dev/actionpop-api:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://actionpop:actionpop@postgres:5432/actionpop}
      NODE_ENV: ${NODE_ENV:-production}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      PORT: "3000"
      # Origins allowed to read the public JSON routes; list the published site origin.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      # Empty means "search the usual paths". Naming a file makes it mandatory, and
      # config/actionpop.yaml is git-ignored, so a hard-coded default would stop the API
      # from starting on a fresh clone or in CI.
      APP_CONFIG_FILE: ${APP_CONFIG_FILE:-}
    volumes:
      # The whole document directory is mounted read-only: the runtime picks
      # config/actionpop.yaml when the operator ships one, and falls back to the example.
      - ../../config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - private
      # Reaches the monitor's Prometheus without publishing a port on the host.
      - monitoring
    restart: unless-stopped
    healthcheck:
      # Loopback, like every other probe: a service name would make the check depend on Docker
      # DNS instead of answering "is this container serving?".
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/internal/live']
      interval: 10s
      timeout: 3s
      retries: 5
      # A cold start on a loaded machine must not consume the retries before the server listens.
      start_period: 20s

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/bigchef-dev/actionpop-worker:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://actionpop:actionpop@postgres:5432/actionpop}
      NODE_ENV: ${NODE_ENV:-production}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      UPSTREAM_TOKEN: ${UPSTREAM_TOKEN:-}
      WORKER_HEALTH_PORT: "8081"
      # Same rule as the API: an empty value lets the runtime fall back to the example.
      APP_CONFIG_FILE: ${APP_CONFIG_FILE:-}
    volumes:
      - ../../config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - private
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8081/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  edge:
    image: nginx:1.29-alpine
    profiles: ['edge']
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../edge/https.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared header snippet: the same file the CI scan serves over plain HTTP.
      - ../edge/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - private
      - monitoring
      - caddy_network
    restart: unless-stopped

networks:
  private:
    internal: true

  # Owned by the monitoring Compose project. Declared external so this stack never creates or
  # destroys it: `docker network create monitoring` once on the host, then both projects join it.
  monitoring:
    external: true
    name: monitoring

  caddy_network:
    external: true
    name: caddy_network

volumes:
  redis-data:
  postgres-data:
