name: actionpop

services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - private
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-actionpop}
      POSTGRES_USER: ${POSTGRES_USER:-actionpop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-actionpop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the migrations the running images expect, then exits. Both application
  # services wait for it, so a deployment can never start against an older schema.
  migrate:
    image: ${WORKER_IMAGE:-actionpop-worker:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    entrypoint: ['node_modules/.bin/prisma', 'migrate', 'deploy', '--schema=prisma/schema.prisma']
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://actionpop:actionpop@postgres:5432/actionpop}
      NODE_ENV: ${NODE_ENV:-production}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: 'no'

  api:
    image: ${API_IMAGE:-actionpop-api:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://actionpop:actionpop@postgres:5432/actionpop}
      NODE_ENV: ${NODE_ENV:-production}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      PORT: "3000"
      # Origins allowed to read the public JSON routes; list the published site origin.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      APP_CONFIG_FILE: ${APP_CONFIG_FILE:-/app/config/actionpop.yaml}
    volumes:
      # The whole document directory is mounted read-only, so the image still
      # starts from the shipped example when config/actionpop.yaml is absent.
      - ../../config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://api:3000/internal/live']
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: ${WORKER_IMAGE:-actionpop-worker:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgresql://actionpop:actionpop@postgres:5432/actionpop}
      NODE_ENV: ${NODE_ENV:-production}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      UPSTREAM_TOKEN: ${UPSTREAM_TOKEN:-}
      WORKER_HEALTH_PORT: "8081"
      APP_CONFIG_FILE: ${APP_CONFIG_FILE:-/app/config/actionpop.yaml}
    volumes:
      - ../../config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8081/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  edge:
    image: nginx:1.27-alpine
    profiles: ['edge']
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../edge/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped

networks:
  private:
    internal: true

volumes:
  redis-data:
  postgres-data:
