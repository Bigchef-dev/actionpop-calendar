services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - private
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-actionpop-api:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-production}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      PORT: "3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://api:3000/internal/live']
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: ${WORKER_IMAGE:-actionpop-worker:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-production}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:?UPSTREAM_BASE_URL is required}
      UPSTREAM_TOKEN: ${UPSTREAM_TOKEN:-}
      WORKER_HEALTH_PORT: "8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8081/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  edge:
    image: nginx:1.27-alpine
    profiles: ['edge']
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../edge/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped

networks:
  private:
    internal: true

volumes:
  redis-data:
