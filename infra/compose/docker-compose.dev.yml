# Local development overrides. Always combine this file with the base stack:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml up -d
#
# No explicit container_name is declared on purpose: Compose namespaces containers
# with the project name, so repeated runs and multiple checkouts never collide with
# "container name is already in use" errors.
services:
  redis:
    networks:
      - private
      - default
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    networks:
      - private
      - default
    ports:
      - "127.0.0.1:5432:5432"

  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight-data:/data
    networks:
      - private
      - default
    depends_on:
      redis:
        condition: service_healthy

  bull-board:
    image: ghcr.io/felixmosh/bull-board:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5541:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - private
      - default
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redisinsight-data:
