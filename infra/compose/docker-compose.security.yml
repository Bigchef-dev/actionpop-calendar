# Overlay used only by the CI exploitation scan.
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.security.yml up -d --build
#
# It adds a plain-HTTP twin of the edge, published on the loopback interface only, so a scanner on
# the runner can attack the real allowlist and the real headers without certificates. The scanner
# service itself is not declared here: the workflow runs the official image with host networking.
services:
  edge-scan:
    image: nginx:1.27-alpine
    networks:
      - private
      # Docker cannot publish a port from a network declared `internal: true`, so the scanner
      # needs one ordinary network in addition to the private one.
      - default
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ../edge/http-scan.conf:/etc/nginx/conf.d/default.conf:ro
      - ../edge/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: 'no'
