# Merge this job into the existing `scrape_configs` of the Prometheus owned by the monitoring
# stack. Both targets are reached over the shared `monitoring` Docker network, so no host port is
# published and nothing is reachable from the internet.
scrape_configs:
  - job_name: actionpop
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      # The API serves the shared registry on /internal/metrics; the worker embeds its own
      # health server, which answers /metrics on the same port as /health/*.
      - targets: ['api:3000']
        labels:
          service: api
      - targets: ['worker:8081']
        labels:
          service: worker
    relabel_configs:
      # The two targets expose their metrics on different paths, so the path follows the service.
      - source_labels: [service]
        regex: api
        target_label: __metrics_path__
        replacement: /internal/metrics
      - source_labels: [service]
        regex: worker
        target_label: __metrics_path__
        replacement: /metrics
      # Prometheus attaches `instance` from the target already; the application's own
      # `deployment` label stays what distinguishes two instances at cutover.
      - source_labels: [__address__]
        target_label: instance
