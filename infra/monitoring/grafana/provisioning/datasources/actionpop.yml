# The monitor's own Prometheus. The uid is fixed so the dashboards below can reference it without
# a manual mapping step.
apiVersion: 1

datasources:
  - name: ActionPop Prometheus
    uid: actionpop-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 30s
